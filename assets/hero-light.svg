      <path d="M230 77c-7-8-19-7-22-1 4 8 15 10 22 1Z" fill="#33332F" stroke-width="2"/>
      <circle cx="215" cy="76" r="1.4" fill="#FFFFFF" stroke="none"/>
    </g>
    <g class="motion" stroke-width="7">
      <animateTransform attributeName="transform" type="rotate" values="-2.5 319 122;2.5 319 122;-2.5 319 122" dur="12s" begin="-4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <path d="M319 122c13-31 40-45 66-36 20 7 29 31 17 42-10 9-24 2-21-9 3-10 17-12 27-2 17 17 12 39-7 38"/>
      <path d="M401 155c-3-8-14-12-20-6 1 9 13 12 20 6Z" fill="#33332F" stroke-width="2"/>
      <circle cx="387" cy="150" r="1.4" fill="#FFFFFF" stroke="none"/>
    </g>
    <g stroke-width="8">
      <path d="M278 186c-26-25-28-52-10-73 13-15 33-16 43-33 9-17-3-31-16-28-13 3-12 18-2 21 9 3 19-6 25-13"/>
      <path d="M318 60c-1-9 7-17 15-14 3 9-6 17-15 14Z" fill="#33332F" stroke-width="2"/>
      <circle cx="329" cy="51" r="1.4" fill="#FFFFFF" stroke="none"/>
      <path d="M299 133c-2-26-18-44-35-42-19 2-21 22-10 28 9 4 15-1 17-7"/>
      <path d="M271 112c-1-8 7-15 14-11 1 8-6 14-14 11Z" fill="#33332F" stroke-width="2"/>
      <circle cx="281" cy="105" r="1.3" fill="#FFFFFF" stroke="none"/>
      <path d="M291 178c-24 13-47 30-41 52 4 17 25 19 30 8 5-11-7-20-15-14"/>
      <path d="M265 224c-8-5-17 0-17 8 7 5 16 1 17-8Z" fill="#33332F" stroke-width="2"/>
      <circle cx="253" cy="230" r="1.3" fill="#FFFFFF" stroke="none"/>
    </g>
  </g>
  <!-- Classical profile: continuous forehead/nose, quiet eye, long neck. -->
  <path d="M292 122c16-19 45-21 62-5 12 11 10 26 13 39l17 29c2 4-3 6-12 6l-2 10 6 4-7 6c3 13-7 22-21 19l-8-2c-2 17 5 29 21 42h-76c20-19 28-34 25-52-3-18-17-22-26-42-9-20-7-39 8-54Z" fill="#33332F"/>
  <path d="M291 125c17-19 43-20 58-8-13-2-24 3-31 13-8 11-9 28-15 38-5-12-13-14-20-9-2-14 0-25 8-34Z" fill="#FFFFFF"/>
